# ============================================================
# Config utama nginx.
# ============================================================
# Isi di bawah ini sebagian besar standar — biasanya kamu TIDAK
# perlu mengubah file ini. Yang kamu sentuh sehari-hari adalah
# folder conf.d/sites/ (satu file .conf per domain).
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Resolver DNS internal Docker.
    # Dipakai nginx untuk menerjemahkan nama container (mis. "app-ku")
    # menjadi alamat IP, dan otomatis resolve ulang tiap 30 detik
    # supaya tidak "nyangkut" ke IP lama saat container restart.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format log akses (siapa akses apa, kapan, hasilnya)
    log_format  main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Semua config site di-load dari sini.
    # default.conf memuat lagi folder sites/ (satu file per domain).
    include /etc/nginx/conf.d/*.conf;
}
