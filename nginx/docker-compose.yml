# ============================================================
# NGINX — reverse proxy (satpam pintu masuk semua website)
# ============================================================
# Fungsi: semua domain mengarah ke server ini (port 80/443),
# lalu nginx membagikan traffic ke container app yang tepat
# sesuai config di src/conf.d/sites/ (satu file per domain).
#
# Yang penting diketahui:
# - File config nginx ADA DI FOLDER INI (src/), BUKAN di dalam image.
#   Ubah config  ->  docker compose restart nginx  (tidak perlu build!)
# - Sertifikat SSL dibuat oleh certbot di HOST (di luar Docker),
#   lalu di-mount ke container lewat volume /etc/letsencrypt.
# ============================================================

services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"    # HTTP  -> otomatis dialihkan ke HTTPS oleh config site
      - "443:443"  # HTTPS -> di sinilah SSL di-terminate

    volumes:
      # Config utama nginx (dari repo ini, read-only)
      - ./src/nginx.conf:/etc/nginx/nginx.conf:ro
      # Semua config site (dari repo ini, read-only)
      - ./src/conf.d:/etc/nginx/conf.d:ro
      # Sertifikat SSL buatan certbot (ada di host, read-only)
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - proxy-network

# proxy-network = "gorup chat" Docker: container app lain yang ikut
# network ini bisa dihubungi nginx lewat nama container-nya
# (contoh: proxy_pass http://app-ku:3000).
# Network ini dibuat oleh bootstrap.sh di root repo.
networks:
  proxy-network:
    external: true
