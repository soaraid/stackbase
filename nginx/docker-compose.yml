services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./src/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
