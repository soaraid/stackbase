services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always

    ports:
      - "127.0.0.1:3306:3306"

    env_file:
      - .env

    volumes:
      - ${DATA_ROOT}/mysql:/var/lib/mysql

    networks:
      - shared-db-network

networks:
  shared-db-network:
    external: true
    name: shared-db-network
